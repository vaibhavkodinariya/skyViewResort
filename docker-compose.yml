version: "3"
services:
  app:
    build: .
    ports:
      - "6000:3000"
    container_name: app
    depends_on:
      - mongo
    env_file:
      - .env
    volumes:
      - ./src/public:/backend/src/public
      - ./logs:/backend/logs
    restart: always
    networks:
      - resort-network

  mongo:
    image: mongo:latest
    ports:
      - "3866:27017"
    volumes:
      - ./mongo-data:/data/db
    restart: always
    networks:
      - resort-network

volumes:
  mongo-data:

networks:
  resort-network:
    external: true
