version: "3"
services:
  app:
    build: .
    ports:
      - "6000:3000"
    container_name: app
    depends_on:
      - mongo
    env_file:
      - .env
    volumes:
      - ./src/public:/backend/src/public
      - ./logs:/backend/logs
    restart: always
  mongo:
    image: mongo:latest
    ports:
      - "3866:27017"
    volumes:
      - ./mongo-data:/data/db
    restart: always
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/certs:ro # Map your certificates folder
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  mongo-data:
