version: "3"
services:
  app:
    build: .
    ports:
      - "6000:3000"
    depends_on:
      - mongo
    env_file:
      - .env
    volumes:
      - ./src/public:/backend/src/public
      - ./logs:/backend/logs
      - ./certs:/backend/certs
    restart: always

  mongo:
    image: mongo:latest
    ports:
      - "3866:27017"
    volumes:
      - ./mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
