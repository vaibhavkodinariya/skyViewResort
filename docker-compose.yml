version: "3"
services:
  app:
    build: .
    ports:
      - "6000:3000"
    container_name: app
    depends_on:
      - mongo
    env_file:
      - .env
    volumes:
      - ./src/public:/backend/src/public
      - ./logs:/backend/logs
    restart: always
    networks:
      - resort-network

  mongo:
    image: mongo:latest
    ports:
      - "3866:27017"
    volumes:
      - ./mongo-data:/data/db
    restart: always
    networks:
      - resort-network
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6369:6379"
    volumes:
      - redis-data:/data
    restart: always
    networks:
      - resort-network
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
volumes:
  mongo-data:
  redis-data:

networks:
  resort-network:
    external: true
